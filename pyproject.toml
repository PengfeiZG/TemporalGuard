[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporalguard"
version = "0.1.0"
description = "Cost-aware multi-scale semantic detection of distributed prompt injection in tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["llm", "agents", "prompt-injection", "security", "defense"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
temporalguard = "temporalguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# long strings are data (AgentDojo prompts and benign text), not code
"src/temporalguard/eval/agentdojo_data.py" = ["E501"]
